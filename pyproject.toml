[tool.black]
line-length = 120
target-version = ["py310"]
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = true

[tool.pylint]
max-line-length = 120

[tool.pylint.'DESIGN']
min-public-methods = 0

[tool.pylint.'MESSAGES CONTROL']
disable = ["import-error"]
